name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild -scheme OctokanSDK -destination 'generic/platform=iOS Simulator' build 2>&1 | tee build.log || {
            # surface each compiler error as an annotation so it shows up without opening the log
            grep -E "error:" build.log | sort -u | head -30 | while read -r line; do echo "::error::${line}"; done
            exit 1
          }
